[package]
edition      = "2024"
name         = "remoteswitchpro"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "remoteswitchpro"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["unstable", "esp32s3"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["println", "esp32s3"] }
esp-println = { version = "0.17.0", default-features = false, features = ["critical-section", "esp32s3"] }
esp-radio = { version = "0.18.0", features = ["esp-alloc", "unstable", "wifi", "esp32s3"] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.7"
embassy-futures = "0.1"
embassy-usb = "0.5"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dhcpv4-hostname", "dns", "medium-ethernet", "tcp", "udp"] }

picoserve = { version = "0.18.0", features = ["alloc", "embassy", "json", "log"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

log = "0.4"
critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = "0.9"

[features]
default = ["uart-log"]
# Console on UART0 (GPIO43/44). The USB pins belong to the OTG controller.
uart-log = ["esp-println/uart"]
# Debug build: console on USB-Serial-JTAG, and the controller emulation is
# not started (the two share the USB pins).
#   cargo build --release --no-default-features --features jtag-log
jtag-log = ["esp-println/jtag-serial"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 3
